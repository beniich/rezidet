name: Build & Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============== TESTS ==============
  test:
    runs-on: ubuntu-latest
    if: ${{ inputs.skip_tests != 'true' }}
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rezidet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Setup database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rezidet_test
        run: |
          cd backend
          npx prisma generate
          npx prisma migrate deploy
          npm run seed || true

      - name: Test backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rezidet_test
          JWT_SECRET: test-secret-key-for-ci-only
        run: cd backend && npm test

      - name: Lint backend
        run: cd backend && npm run lint

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Test frontend
        run: cd frontend && npm test

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Build frontend
        run: cd frontend && npm run build:prod

  # ============== BUILD & PUSH IMAGES ==============
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ui
          tags: |
            type=sha,prefix=git-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push UI
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ui:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            VITE_WS_URL=
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_STRIPE_PUBLIC_KEY=${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
            VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}
            VITE_APP_NAME=Rezidet
            VITE_ENV=production

  # ============== DEPLOY TO PRODUCTION ==============
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rezidet.app

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "🚀 Déploiement sur $(hostname)"
            cd /app/rezidet
            
            # Backup avant deploy
            bash scripts/backup-db.sh || echo "Backup warning"
            
            # Pull nouvelles images
            docker compose pull
            
            # Migrations
            docker compose run --rm api npx prisma migrate deploy
            
            # Redémarrer
            docker compose up -d --remove-orphans
            
            # Cleanup
            docker image prune -f
            
            # Health check
            sleep 15
            HEALTH=$(curl -s http://localhost/api/health | jq -r '.status' 2>/dev/null || echo "FAIL")
            if [ "$HEALTH" != "OK" ]; then
              echo "❌ Health check failed, rolling back..."
              bash scripts/rollback.sh
              exit 1
            fi
            echo "✅ Deploy successful"

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 Deploy ${{ job.status }} - ${{ github.sha }}
            Environment: Production
            Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
