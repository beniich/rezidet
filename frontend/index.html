<!DOCTYPE html>
<html lang="fr" class="dark" style="background-color:#090218">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          const persisted = localStorage.getItem('cafm-theme');
          if (persisted) {
            const state = JSON.parse(persisted).state;
            if (state && state.theme) {
              document.documentElement.setAttribute('data-theme', state.theme);
              document.documentElement.className = state.theme;
              return;
            }
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.className = 'dark';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090218" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAFM Pro" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO -->
    <title>CAFM Pro — Facility Management</title>
    <meta name="description" content="Plateforme CAFM Pro — Gestion intelligente des installations, maintenance prédictive, BIM et ERP." />
    <meta name="keywords" content="CAFM, facility management, maintenance, BIM, ERP, GMAO" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[SW] Registered:', reg.scope))
            .catch(err => console.warn('[SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
